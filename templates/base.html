<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zenlayer Account Engagement{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; margin: 0; }
        .donut-logo {
            background: linear-gradient(to right, #33d4ff, #0076ff) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
        }
        .sidebar-transition { transition: width 0.2s ease; }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body class="flex h-screen overflow-hidden" x-data="{ sidebarOpen: localStorage.getItem('sidebarOpen') !== 'false', briefingsExpanded: localStorage.getItem('briefingsExpanded') !== 'false' }"
      x-init="$watch('sidebarOpen', val => localStorage.setItem('sidebarOpen', val)); $watch('briefingsExpanded', val => localStorage.setItem('briefingsExpanded', val))">

    <!-- Sidebar -->
    <aside class="sidebar-transition flex-shrink-0 bg-white border-r border-slate-100 flex flex-col h-full overflow-hidden"
           :class="sidebarOpen ? 'w-56' : 'w-[56px]'">

        <!-- Logo -->
        <div class="h-16 flex items-center border-b border-slate-50 flex-shrink-0"
             :class="sidebarOpen ? 'px-4' : 'justify-center'">
            <a href="/qbr/" class="flex items-center space-x-2.5 hover:opacity-80 transition-opacity min-w-0">
                <div class="relative w-7 h-7 flex-shrink-0 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full border-[4px] border-transparent donut-logo"></div>
                </div>
                <div x-show="sidebarOpen" x-cloak class="flex flex-col min-w-0">
                    <span class="text-lg font-medium text-[#2d3b45] tracking-tight leading-none">zenlayer</span>
                    <span class="text-[8px] font-bold text-slate-400 uppercase tracking-[0.15em] mt-0.5 leading-none">Engagement</span>
                </div>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-4 overflow-y-auto overflow-x-hidden">
            <div class="space-y-1" :class="sidebarOpen ? 'px-3' : 'px-1.5'">

                <!-- Portfolio -->
                <a href="/qbr/"
                   class="flex items-center rounded-lg transition-colors group"
                   :class="[
                       sidebarOpen ? 'px-3 py-2.5 space-x-3' : 'justify-center py-2.5',
                       '{{ active_nav }}' === 'portfolio' ? 'bg-slate-100 text-slate-900' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'
                   ]"
                   :title="!sidebarOpen ? 'Portfolio' : ''">
                    <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
                    </svg>
                    <span x-show="sidebarOpen" x-cloak class="text-sm font-medium">Portfolio</span>
                </a>

                <!-- Briefings Section -->
                <div>
                    <button @click="sidebarOpen ? briefingsExpanded = !briefingsExpanded : (sidebarOpen = true, briefingsExpanded = true)"
                            class="w-full flex items-center rounded-lg transition-colors group"
                            :class="[
                                sidebarOpen ? 'px-3 py-2.5 justify-between' : 'justify-center py-2.5',
                                '{{ active_nav }}'.startsWith('briefing') ? 'bg-slate-100 text-slate-900' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700'
                            ]"
                            :title="!sidebarOpen ? 'Briefings' : ''">
                        <div class="flex items-center" :class="sidebarOpen ? 'space-x-3' : ''">
                            <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                            </svg>
                            <span x-show="sidebarOpen" x-cloak class="text-sm font-medium">Briefings</span>
                        </div>
                        <svg x-show="sidebarOpen" x-cloak class="w-3.5 h-3.5 transition-transform" :class="briefingsExpanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>

                    <!-- Sub-items -->
                    <div x-show="sidebarOpen && briefingsExpanded" x-collapse x-cloak class="mt-1 space-y-0.5 ml-4 pl-4 border-l border-slate-100">
                        <a href="/qbr/briefings?type=internal"
                           class="flex items-center px-3 py-2 rounded-lg text-sm transition-colors"
                           :class="'{{ active_nav }}' === 'briefing_internal' ? 'text-slate-900 font-semibold bg-slate-50' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'">
                            <svg class="w-3.5 h-3.5 mr-2.5 flex-shrink-0 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            Internal Brief
                        </a>
                        <a href="/qbr/briefings?type=customer"
                           class="flex items-center px-3 py-2 rounded-lg text-sm transition-colors"
                           :class="'{{ active_nav }}' === 'briefing_customer' ? 'text-slate-900 font-semibold bg-slate-50' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'">
                            <svg class="w-3.5 h-3.5 mr-2.5 flex-shrink-0 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                            </svg>
                            Customer QBR
                        </a>
                    </div>
                </div>

            </div>
        </nav>

        <!-- Collapse Toggle -->
        <div class="border-t border-slate-50 flex-shrink-0" :class="sidebarOpen ? 'px-3 py-3' : 'px-1.5 py-3'">
            <button @click="sidebarOpen = !sidebarOpen"
                    class="w-full flex items-center rounded-lg py-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors"
                    :class="sidebarOpen ? 'px-3 space-x-3' : 'justify-center'">
                <svg class="w-[18px] h-[18px] flex-shrink-0 transition-transform" :class="sidebarOpen ? '' : 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"/>
                </svg>
                <span x-show="sidebarOpen" x-cloak class="text-xs font-medium">Collapse</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
