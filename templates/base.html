<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zenlayer Account Engagement{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; margin: 0; }
        .donut-logo {
            background: linear-gradient(to right, #33d4ff, #0076ff) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
        }
        .sidebar-transition { transition: width 0.15s ease; }
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar — collapses to icons, expands on hover -->
    <aside class="sidebar-transition flex-shrink-0 bg-white border-r border-slate-100 flex flex-col h-full overflow-hidden w-[56px] hover:w-56 group/sidebar"
           x-data="{ hovered: false }"
           @mouseenter="hovered = true"
           @mouseleave="hovered = false">

        <!-- Logo -->
        <div class="h-16 flex items-center border-b border-slate-50 flex-shrink-0 justify-center group-hover/sidebar:px-4 group-hover/sidebar:justify-start transition-all">
            <a href="/qbr/" class="flex items-center space-x-2.5 hover:opacity-80 transition-opacity min-w-0">
                <div class="relative w-7 h-7 flex-shrink-0 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full border-[4px] border-transparent donut-logo"></div>
                </div>
                <div class="hidden group-hover/sidebar:flex flex-col min-w-0">
                    <span class="text-lg font-medium text-[#2d3b45] tracking-tight leading-none whitespace-nowrap">zenlayer</span>
                    <span class="text-[8px] font-bold text-slate-400 uppercase tracking-[0.15em] mt-0.5 leading-none">Engagement</span>
                </div>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-4 overflow-y-auto overflow-x-hidden">
            <div class="space-y-1 px-1.5 group-hover/sidebar:px-3 transition-all">

                <!-- Portfolio -->
                <a href="/qbr/"
                   class="flex items-center rounded-lg transition-colors justify-center group-hover/sidebar:justify-start group-hover/sidebar:px-3 py-2.5 group-hover/sidebar:space-x-3
                          {{ 'bg-slate-100 text-slate-900' if active_nav == 'portfolio' else 'text-slate-500 hover:bg-slate-50 hover:text-slate-700' }}"
                   title="Portfolio">
                    <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/>
                    </svg>
                    <span class="text-sm font-medium hidden group-hover/sidebar:inline whitespace-nowrap">Portfolio</span>
                </a>

                <!-- Briefings -->
                <a href="/qbr/briefings"
                   class="flex items-center rounded-lg transition-colors justify-center group-hover/sidebar:justify-start group-hover/sidebar:px-3 py-2.5 group-hover/sidebar:space-x-3
                          {{ 'bg-slate-100 text-slate-900' if active_nav.startswith('briefing') else 'text-slate-500 hover:bg-slate-50 hover:text-slate-700' }}"
                   title="Briefings">
                    <svg class="w-[18px] h-[18px] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                    </svg>
                    <span class="text-sm font-medium hidden group-hover/sidebar:inline whitespace-nowrap">Briefings</span>
                </a>

            </div>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
