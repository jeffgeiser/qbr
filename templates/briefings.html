{% extends "base.html" %}

{% block title %}Briefing Generator - Zenlayer{% endblock %}

{% block content %}
<div x-data="briefingGenerator()">
    <main class="max-w-5xl mx-auto px-6 py-8">
        <div class="mb-10">
            <h1 class="text-3xl font-bold text-slate-900 mb-1">Account Briefing Generator</h1>
            <p class="text-slate-500 text-sm font-medium">Generate executive briefings powered by Salesforce data</p>
        </div>

        <!-- Step 1: Choose Briefing Type -->
        <div x-show="!selectedType" class="space-y-6">
            <h2 class="text-lg font-bold text-slate-900">Choose Briefing Type</h2>
            <div class="grid grid-cols-2 gap-6">

                <!-- Internal Executive Health Brief -->
                <button @click="selectedType = 'internal'"
                        class="bg-white rounded-2xl border-2 border-slate-100 hover:border-amber-300 shadow-sm hover:shadow-lg hover:shadow-amber-50 transition-all text-left">
                    <div class="p-8">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center">
                                <svg class="w-5 h-5 text-amber-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-900">Internal</h3>
                                <p class="text-xs text-slate-500 font-medium">Executive Health Brief</p>
                            </div>
                        </div>
                        <p class="text-sm text-slate-600 mb-5 leading-relaxed">Candid risk assessment for internal leadership. No-fluff analysis of account health, friction points, and revenue exposure.</p>
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                                <span>At-risk scorecard (5 dimensions)</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                                <span>Friction points & escalations</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                                <span>Revenue at risk analysis</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                                <span>Internal red flags & action directives</span>
                            </div>
                        </div>
                    </div>
                </button>

                <!-- Customer-Facing QBR -->
                <button @click="selectedType = 'customer'"
                        class="bg-white rounded-2xl border-2 border-slate-100 hover:border-blue-300 shadow-sm hover:shadow-lg hover:shadow-blue-50 transition-all text-left">
                    <div class="p-8">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center">
                                <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-900">Customer</h3>
                                <p class="text-xs text-slate-500 font-medium">Facing QBR</p>
                            </div>
                        </div>
                        <p class="text-sm text-slate-600 mb-5 leading-relaxed">Professional partnership review for presenting to the customer. Demonstrates transparency, proves ROI, and roadmaps the future.</p>
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                <span>Executive summary of partnership</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                <span>Operational performance highlights</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                <span>Service improvement plan</span>
                            </div>
                            <div class="flex items-center space-x-2 text-sm text-slate-500">
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                <span>Strategic roadmap & joint action plan</span>
                            </div>
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Step 2: Chat Input -->
        <div x-show="selectedType" x-cloak>
            <!-- Type Badge + Back -->
            <div class="flex items-center space-x-3 mb-6">
                <button @click="selectedType = null; messages = []; chatInput = ''" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </button>
                <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-sm font-semibold"
                     :class="selectedType === 'internal' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-blue-50 text-blue-700 border border-blue-200'">
                    <template x-if="selectedType === 'internal'">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                        </svg>
                    </template>
                    <template x-if="selectedType === 'customer'">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
                        </svg>
                    </template>
                    <span x-text="selectedType === 'internal' ? 'Internal Health Brief' : 'Customer-Facing QBR'"></span>
                </div>
            </div>

            <!-- Chat Messages Area -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm mb-4 min-h-[400px] max-h-[60vh] overflow-y-auto" id="chatArea">
                <div class="p-6 space-y-4">
                    <!-- System Prompt -->
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                             :class="selectedType === 'internal' ? 'bg-amber-100' : 'bg-blue-100'">
                            <svg class="w-4 h-4" :class="selectedType === 'internal' ? 'text-amber-600' : 'text-blue-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/>
                            </svg>
                        </div>
                        <div class="bg-slate-50 rounded-xl rounded-tl-none px-4 py-3 max-w-xl">
                            <p class="text-sm text-slate-700 leading-relaxed" x-text="selectedType === 'internal'
                                ? 'I\'ll generate an Internal Executive Health Brief. Tell me the customer name and the timeframe you\'d like me to analyze (e.g. &quot;Zoom, last 90 days&quot;).'
                                : 'I\'ll generate a Customer-Facing QBR. Tell me the customer name and the timeframe you\'d like me to cover (e.g. &quot;Zoom, last quarter&quot;).'"></p>
                        </div>
                    </div>

                    <!-- Dynamic Messages -->
                    <template x-for="(msg, idx) in messages" :key="idx">
                        <div>
                            <!-- User Message -->
                            <div x-show="msg.role === 'user'" class="flex items-start space-x-3 justify-end">
                                <div class="bg-slate-900 text-white rounded-xl rounded-tr-none px-4 py-3 max-w-xl">
                                    <p class="text-sm leading-relaxed" x-text="msg.content"></p>
                                </div>
                                <div class="w-8 h-8 rounded-lg bg-slate-200 flex items-center justify-center flex-shrink-0">
                                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/>
                                    </svg>
                                </div>
                            </div>

                            <!-- Assistant Message -->
                            <div x-show="msg.role === 'assistant'" class="flex items-start space-x-3">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                                     :class="selectedType === 'internal' ? 'bg-amber-100' : 'bg-blue-100'">
                                    <svg class="w-4 h-4" :class="selectedType === 'internal' ? 'text-amber-600' : 'text-blue-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/>
                                    </svg>
                                </div>
                                <div class="bg-slate-50 rounded-xl rounded-tl-none px-4 py-3 max-w-xl">
                                    <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-line" x-text="msg.content"></p>
                                </div>
                            </div>

                            <!-- Tool Activity -->
                            <div x-show="msg.role === 'tool_activity'" class="flex items-center space-x-3 pl-11">
                                <div class="flex items-center space-x-2 px-3 py-1.5 bg-slate-100 rounded-lg">
                                    <svg class="animate-spin w-3.5 h-3.5 text-slate-500" x-show="msg.status === 'working'" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                                    <svg class="w-3.5 h-3.5 text-emerald-500" x-show="msg.status === 'done'" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                                    <span class="text-xs font-medium" :class="msg.status === 'done' ? 'text-slate-500' : 'text-slate-700'" x-text="msg.content"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Typing Indicator -->
                    <div x-show="isGenerating && !isStreaming" x-cloak class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                             :class="selectedType === 'internal' ? 'bg-amber-100' : 'bg-blue-100'">
                            <svg class="w-4 h-4" :class="selectedType === 'internal' ? 'text-amber-600' : 'text-blue-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                            </svg>
                        </div>
                        <div class="bg-slate-50 rounded-xl rounded-tl-none px-4 py-3">
                            <div class="flex space-x-1.5">
                                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-3">
                <form @submit.prevent="sendMessage()" class="flex items-center space-x-3">
                    <input type="text"
                           x-model="chatInput"
                           :disabled="isGenerating"
                           :placeholder="messages.length === 0 ? 'e.g. Zoom, last 90 days' : 'Ask a follow-up or refine...'"
                           class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-1 focus:ring-blue-400 disabled:opacity-50"
                           x-ref="chatInputEl"
                           autofocus>
                    <button type="submit"
                            :disabled="!chatInput.trim() || isGenerating"
                            class="px-5 py-3 rounded-xl text-sm font-bold transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                            :class="selectedType === 'internal' ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white'">
                        <span x-show="!isGenerating">Generate</span>
                        <span x-show="isGenerating" class="flex items-center space-x-2">
                            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                            <span>Working...</span>
                        </span>
                    </button>
                </form>
            </div>

            <!-- Error State -->
            <div x-show="error" x-cloak class="mt-4 bg-rose-50 rounded-2xl border border-rose-200 p-4">
                <div class="flex items-start space-x-3">
                    <svg class="w-5 h-5 text-rose-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    <div>
                        <h4 class="text-sm font-bold text-rose-800">Something went wrong</h4>
                        <p class="text-sm text-rose-600 mt-1" x-text="error"></p>
                        <button @click="error = null" class="mt-2 text-sm font-semibold text-rose-700 hover:text-rose-800">Dismiss</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script>
    function briefingGenerator() {
        return {
            selectedType: '{{ preselected_type or "" }}' || null,
            chatInput: '',
            messages: [],
            isGenerating: false,
            isStreaming: false,
            error: null,

            init() {
                // If preselected type, focus the chat input
                if (this.selectedType) {
                    this.$nextTick(() => this.$refs.chatInputEl?.focus());
                }
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const el = document.getElementById('chatArea');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            },

            async sendMessage() {
                const input = this.chatInput.trim();
                if (!input || this.isGenerating) return;

                this.chatInput = '';
                this.error = null;

                // Add user message
                this.messages.push({ role: 'user', content: input });
                this.scrollToBottom();

                this.isGenerating = true;

                try {
                    const response = await fetch('/qbr/api/briefings/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            briefing_type: this.selectedType,
                            user_message: input,
                        }),
                    });

                    if (!response.ok) {
                        let errMsg = `Server error (${response.status})`;
                        try {
                            const errBody = await response.text();
                            const errJson = JSON.parse(errBody);
                            errMsg = errJson.detail || errJson.message || errMsg;
                        } catch(e) {}
                        this.error = errMsg;
                        return;
                    }

                    // Stream the SSE response
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const event = JSON.parse(data);
                                this.handleStreamEvent(event);
                            } catch (e) {
                                // Skip malformed lines
                            }
                        }
                    }

                } catch (err) {
                    console.error('Briefing fetch error:', err);
                    this.error = err.message || 'Failed to connect to server';
                } finally {
                    this.isGenerating = false;
                    this.isStreaming = false;
                }
            },

            handleStreamEvent(event) {
                switch (event.type) {
                    case 'status':
                        this.isStreaming = true;
                        this.messages.push({
                            role: 'assistant',
                            content: event.message,
                        });
                        this.scrollToBottom();
                        break;

                    case 'tool_start':
                        this.isStreaming = true;
                        this.messages.push({
                            role: 'tool_activity',
                            content: event.message,
                            status: 'working',
                        });
                        this.scrollToBottom();
                        break;

                    case 'tool_done':
                        // Update the last tool_activity message to done
                        for (let i = this.messages.length - 1; i >= 0; i--) {
                            if (this.messages[i].role === 'tool_activity' && this.messages[i].status === 'working') {
                                this.messages[i].status = 'done';
                                this.messages[i].content = event.message || this.messages[i].content;
                                break;
                            }
                        }
                        break;

                    case 'assistant_message':
                        this.messages.push({
                            role: 'assistant',
                            content: event.message,
                        });
                        this.scrollToBottom();
                        break;

                    case 'briefing_ready':
                        // Redirect to the results page
                        this.messages.push({
                            role: 'assistant',
                            content: 'Your briefing is ready! Redirecting...',
                        });
                        this.scrollToBottom();
                        setTimeout(() => {
                            window.location.href = '/qbr/briefings/' + event.account_id + '/' + this.selectedType + '?result_id=' + event.result_id;
                        }, 1000);
                        break;

                    case 'error':
                        this.error = event.message;
                        break;
                }
            }
        }
    }
</script>
{% endblock %}
