name: dashboards

services:
  qbr:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - qbr-data:/app/data
    environment:
      - DB_PATH=/app/data/accounts.db
      # Local LLM server for briefing generation
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://10.1.0.251:18010/v1/}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-Qwen/Qwen3.5-35B-A3B}
      # Salesforce MCP credentials (optional - briefings work without, using tracker data only)
      - SALESFORCE_CONNECTION_TYPE=${SALESFORCE_CONNECTION_TYPE:-OAuth_2.0_Client_Credentials}
      - SALESFORCE_CLIENT_ID=${SALESFORCE_CLIENT_ID:-}
      - SALESFORCE_CLIENT_SECRET=${SALESFORCE_CLIENT_SECRET:-}
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL:-}
      # Teams / webhook integration (optional)
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
    restart: unless-stopped

volumes:
  qbr-data:
    name: qbr-data
